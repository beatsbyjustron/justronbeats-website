<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Justron Tanks</title>
<style>
  html,body{margin:0;height:100%;background:#1c1915;color:#f4ead6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #hud{display:flex;gap:26px;align-items:center;font-weight:700;letter-spacing:.05em;font-size:14px;text-transform:uppercase;height:30px;color:#e9dcc0}
  #hud span b{color:#fff;font-size:16px;margin-left:6px}
  #hud .hearts{color:#e5534b;font-size:17px;letter-spacing:2px}
  #hud button{background:none;border:1px solid #5a4f40;color:#e9dcc0;border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
  #stage{position:relative}
  canvas{display:block;border-radius:10px;box-shadow:0 14px 50px rgba(0,0,0,.55);cursor:none;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;pointer-events:none}
  .panel{pointer-events:auto;cursor:default;background:rgba(32,26,20,.92);border:2px solid #6b5636;border-radius:14px;padding:30px 38px;text-align:center;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .panel h1{margin:0 0 4px;font-size:46px;letter-spacing:.06em;color:#ffd77a;text-shadow:0 3px 0 #7a4d17}
  .panel h2{margin:0 0 10px;font-size:30px;color:#ffd77a;letter-spacing:.05em}
  .panel p{margin:8px 0;line-height:1.5;color:#e8dcc4}
  .controls{display:grid;grid-template-columns:auto auto;gap:6px 18px;text-align:left;margin:16px auto;width:max-content;font-size:14px}
  .controls kbd{background:#4a3d2c;border:1px solid #7b6545;border-bottom-width:3px;border-radius:5px;padding:1px 7px;font-family:inherit;font-size:12px;color:#fff}
  .btn{pointer-events:auto;margin-top:14px;background:#e9a83a;color:#2a1c08;border:none;border-bottom:4px solid #9c661a;border-radius:10px;padding:11px 30px;font-size:18px;font-weight:800;letter-spacing:.06em;cursor:pointer;text-transform:uppercase}
  .btn:hover{background:#f5b84d}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .banner{background:rgba(28,22,16,.82);border-top:3px solid #e9a83a;border-bottom:3px solid #e9a83a;width:100%;padding:18px 0;text-align:center}
  .banner h2{margin:0;font-size:36px;letter-spacing:.08em;color:#ffd77a}
  .banner p{margin:6px 0 0;color:#e8dcc4}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
  .chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);padding:5px 11px;border-radius:20px;font-size:14px}
  .chip i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.4)}
  .chip .new{color:#ffd77a;font-size:11px;font-weight:800;letter-spacing:.05em}
  .stats{margin:12px 0;font-size:16px}
  .small{font-size:12px;opacity:.7}
  #hud button:disabled{opacity:.35;cursor:default}
  .btn2{pointer-events:auto;background:#4a3d2c;color:#f4ead6;border:1px solid #7b6545;border-bottom-width:3px;border-radius:8px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;margin:6px 4px 0}
  .btn2:hover{background:#5a4a35}
  .beat{margin-top:16px;padding-top:12px;border-top:1px solid #4a3d2c;font-size:13px}
  .beat .err{color:#ff8a7a}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tag{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#cdbb98;margin:-2px 0 10px}
  .panel a,.banner a,#np a{color:#ffd77a}
  .card{margin:16px auto 0;padding:12px 14px;border:1px solid #6b5636;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px;max-width:380px}
  .card .bn{font-size:17px;font-weight:800;color:#fff;margin:2px 0 8px}
  .lic{display:inline-block;background:#e9a83a;color:#2a1c08;font-weight:800;text-decoration:none;border-radius:8px;padding:8px 16px;border-bottom:3px solid #9c661a;letter-spacing:.04em}
  .panel a.lic,.card a.lic{color:#2a1c08}
  .code{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:.12em;color:#fff;background:#14110d;border:2px dashed #e9a83a;border-radius:8px;padding:8px 18px;margin:8px 0}
  .signup{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .signup input{background:#14110d;border:1px solid #7b6545;border-radius:8px;color:#fff;padding:8px 10px;font:inherit;font-size:14px;width:200px}
  #np{position:absolute;left:10px;bottom:10px;background:rgba(20,16,12,.78);border:1px solid #5a4a35;border-radius:20px;padding:5px 12px;font-size:12px;color:#e9dcc0;display:none;pointer-events:auto;cursor:default;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #np b{color:#fff}
  #hud a{color:#ffd77a;text-decoration:none;font-size:12px}
</style>
</head>

  const n = parseInt(hex.slice(1), 16);

function tone(freq, dur, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);

  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 900) {
  if (!ac || muted) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);

  src.connect(f).connect(g).connect(ac.destination); src.start();

// Breadth-first distance field from the player's tile, used by enemies to navigate
function computeFlow() {
  if (!player) return;

  const cur = flow[cy * COLS + cx];

  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {

  for (let i = 0; i < 26; i++) {
    const a = Math.random() * TAU, s = rand(30, 190);
    parts.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, r: rand(4, 10), kind: Math.random() < 0.55 ? 'fire' : 'smoke' });
  }
  parts.push({ x: t.x, y: t.y, vx: 0, vy: 0, life: 0.35, max: 0.35, r: 40, kind: 'ring' });
  scorches.push({ x: t.x, y: t.y, a: Math.random() * TAU, color: t.cfg.color });
  shake = Math.max(shake, 7);
  sfx.small();
  if (t === player) {
    if (state === 'play') { setState('dead'); sfx.lose(); }
  } else {
    levelAlive[t.idx] = false;
    score += t.cfg.pts * 100; kills++;
    missionKills[t.type] = (missionKills[t.type] || 0) + 1;
    updateHud();
  }
}

function explode(x, y, src) {
  const RAD = 72;
  for (const m of mines) if (m.alive && m !== src && (m.x - x) ** 2 + (m.y - y) ** 2 < RAD * RAD) m.fuse = Math.min(m.fuse, m.t + 0.08);
  for (const t of tanks) if (t.alive && (t.x - x) ** 2 + (t.y - y) ** 2 < (RAD + 8) ** 2) killTank(t);
  for (const s of shells) if (s.alive && (s.x - x) ** 2 + (s.y - y) ** 2 < RAD * RAD) { s.alive = false; puff(s.x, s.y); }
  let changed = false;
  const cx0 = Math.floor((x - RAD) / TILE), cx1 = Math.floor((x + RAD) / TILE), cy0 = Math.floor((y - RAD) / TILE), cy1 = Math.floor((y + RAD) / TILE);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    if (tileAt(cx, cy) !== 2) continue;
    const tx = cx * TILE + TILE / 2, ty = cy * TILE + TILE / 2;
    if ((tx - x) ** 2 + (ty - y) ** 2 < (RAD + 12) ** 2) {
      grid[cy * COLS + cx] = 0; changed = true;
      for (let i = 0; i < 8; i++) parts.push({ x: tx + rand(-15, 15), y: ty + rand(-15, 15), vx: rand(-90, 90), vy: rand(-90, 90), life: rand(0.4, 0.8), max: 0.8, r: rand(2, 5), kind: 'chip' });
    }
  }
  if (changed) { drawBg(); flowTile = -1; }
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * TAU, s = rand(20, 230);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 1), max: 1, r: rand(5, 13), kind: Math.random() < 0.6 ? 'fire' : 'smoke' });
  }
  parts.push({ x, y, vx: 0, vy: 0, life: 0.45, max: 0.45, r: RAD, kind: 'ring' });
  scorches.push({ x, y, a: Math.random() * TAU, color: '#333', big: true });
  shake = Math.max(shake, 12);
  sfx.boom();
}

// ---------- Update ----------
function moveTank(t, dt) {
  t.x += t.vx * dt; t.y += t.vy * dt;
  // circle vs tile collision
  for (let iter = 0; iter < 2; iter++) {
    const cx0 = Math.floor((t.x - R) / TILE), cx1 = Math.floor((t.x + R) / TILE);
    const cy0 = Math.floor((t.y - R) / TILE), cy1 = Math.floor((t.y + R) / TILE);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      if (tileAt(cx, cy) === 0) continue;
      const px = Math.max(cx * TILE, Math.min(t.x, cx * TILE + TILE));
      const py = Math.max(cy * TILE, Math.min(t.y, cy * TILE + TILE));
      let dx = t.x - px, dy = t.y - py; const d = Math.hypot(dx, dy);
      if (d < R) {
        if (d < 0.001) { dx = t.x - (cx * TILE + TILE / 2); dy = t.y - (cy * TILE + TILE / 2); const l = Math.hypot(dx, dy) || 1; t.x += dx / l * R; t.y += dy / l * R; }
        else { t.x += dx / d * (R - d); t.y += dy / d * (R - d); }
      }
    }
  }
  const sp = Math.hypot(t.vx, t.vy);
  if (sp > 8) {
    const a = Math.atan2(t.vy, t.vx);
    const target = Math.abs(angDiff(t.bodyAng, a)) > Math.PI / 2 ? a + Math.PI : a;
    t.bodyAng = rotToward(t.bodyAng, target, 9 * dt);
    t.trackDist += sp * dt; t.treadPhase += sp * dt;
    if (t.trackDist > 9) { t.trackDist = 0; treads.push({ x: t.x, y: t.y, a: t.bodyAng, life: 8 }); if (treads.length > 900) treads.shift(); }
  }
}

function updatePlayer(dt) {
  let ix = 0, iy = 0;
  if (state === 'play') {
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['s'] || keys['arrowdown']) iy += 1;
    if (keys['w'] || keys['arrowup']) iy -= 1;
  }
  const l = Math.hypot(ix, iy);
  const tvx = l ? ix / l * PLAYER_SPEED : 0, tvy = l ? iy / l * PLAYER_SPEED : 0;
  const k = Math.min(1, dt * 14);
  player.vx += (tvx - player.vx) * k; player.vy += (tvy - player.vy) * k;
  player.turretAng = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.cool -= dt;
}

function think(e) {
  const c = e.cfg;
  e.solution = null;
  if (!player.alive || state !== 'play') return;
  let tx = player.x, ty = player.y;
  if (c.lead) { const tt = Math.sqrt(dist2(e, player)) / c.shell; tx += player.vx * tt * 0.9; ty += player.vy * tt * 0.9; }
  const a0 = Math.atan2(ty - e.y, tx - e.x);
  const h = traceShot(e.x, e.y, a0, c.bounces, e);
  if (h && h.tank === player) { e.solution = a0; }
  else if (c.aim === 'bounce') {
    let bestA = null, bd = 99;
    const N = 80, off = Math.random() * TAU / N;
    for (let i = 0; i < N; i++) {
      const a = off + i / N * TAU;
      const hh = traceShot(e.x, e.y, a, c.bounces, e);
      if (hh && hh.tank === player) { const d = Math.abs(angDiff(e.turretAng, a)); if (d < bd) { bd = d; bestA = a; } }
    }
    e.solution = bestA;
  }
  // mine laying
  if (c.mines && e.mineCd <= 0 && countMines(e) < c.mines && Math.random() < (e.type === 'y' ? 0.35 : 0.15)) {
    let near = false;
    for (const m of mines) if (m.alive && (m.x - e.x) ** 2 + (m.y - e.y) ** 2 < 110 * 110) near = true;
    if (!near && dist2(e, player) < 420 * 420 && dist2(e, player) > 70 * 70) { if (layMine(e)) e.mineCd = rand(3, 6); }
  }
}

function updateEnemy(e, dt) {
  const c = e.cfg;
  e.cool -= dt; e.thinkT -= dt; e.mineCd -= dt;
  if (e.thinkT <= 0) { e.thinkT = rand(0.2, 0.32); think(e); }
  const want = e.solution != null ? e.solution : Math.atan2(player.y - e.y, player.x - e.x) + Math.sin(time * 0.8 + e.seed) * 0.9;
  e.turretAng = rotToward(e.turretAng, want, c.turn * dt);
  if (e.solution != null && state === 'play' && player.alive && e.cool <= 0 && countShells(e) < c.max && Math.abs(angDiff(e.turretAng, e.solution)) < 0.06) {
    const h = traceShot(e.x, e.y, e.turretAng, c.bounces, e);
    if (h && h.tank === player) fire(e, e.turretAng + rand(-c.err, c.err));
    else { e.cool = 0.15; e.solution = null; }
  }
  // movement
  let dx = 0, dy = 0;
  if (c.speed > 0 && state !== 'intro') {
    const dP = Math.sqrt(dist2(e, player));
    if (player.alive) {
      if (dP > c.keep) { const v = flowDir(e, false); if (v) { dx += v[0]; dy += v[1]; } }
      else if (dP < c.keep * 0.55) { const v = flowDir(e, true); if (v) { dx += v[0]; dy += v[1]; } }
    }
    e.wT -= dt;
    if (e.wT <= 0) { e.wT = rand(1, 2.6); e.wA = Math.random() * TAU; }
    if (tankSolidPt(e.x + Math.cos(e.wA) * 30, e.y + Math.sin(e.wA) * 30)) e.wA += Math.PI * rand(0.5, 1.5);
    dx += Math.cos(e.wA) * 0.6; dy += Math.sin(e.wA) * 0.6;
    // dodge incoming shells
    for (const s of shells) {
      if (!s.alive || (s.owner === e && s.age < 0.4)) continue;
      const rx = e.x - s.x, ry = e.y - s.y, vv = s.vx * s.vx + s.vy * s.vy;
      const tt = (rx * s.vx + ry * s.vy) / vv;
      if (tt < 0 || tt > 0.9) continue;
      const cx = rx - s.vx * tt, cy = ry - s.vy * tt, cd = Math.hypot(cx, cy);
      if (cd < 36) {
        let nx, ny;
        if (cd < 0.01) { const l = Math.sqrt(vv); nx = -s.vy / l; ny = s.vx / l; } else { nx = cx / cd; ny = cy / cd; }
        const w = c.dodge * 4 * (1.3 - cd / 36);
        dx += nx * w; dy += ny * w;
      }
    }
    // avoid mines
    for (const m of mines) {
      if (!m.alive) continue;
      const mx = e.x - m.x, my = e.y - m.y, md = Math.hypot(mx, my);
      if (md < 105 && md > 0.1) { const w = 5 * (1 - md / 105); dx += mx / md * w; dy += my / md * w; }
    }
  }
  const l = Math.hypot(dx, dy);
  const tvx = l > 0.15 ? dx / l * c.speed : 0, tvy = l > 0.15 ? dy / l * c.speed : 0;
  const k = Math.min(1, dt * 6);
  e.vx += (tvx - e.vx) * k; e.vy += (tvy - e.vy) * k;
}

function updateShells(dt) {
  for (const s of shells) {
    if (!s.alive) continue;
    s.age += dt;
    const sp = Math.hypot(s.vx, s.vy);
    const steps = Math.max(1, Math.ceil(sp * dt / 4));
    const sdt = dt / steps;
    for (let i = 0; i < steps && s.alive; i++) {
      const nx = s.x + s.vx * sdt;
      if (shellSolid(nx + Math.sign(s.vx) * 3, s.y)) { s.vx = -s.vx; bounceShell(s); } else s.x = nx;
      if (!s.alive) break;
      const ny = s.y + s.vy * sdt;
      if (shellSolid(s.x, ny + Math.sign(s.vy) * 3)) { s.vy = -s.vy; bounceShell(s); } else s.y = ny;
      if (!s.alive) break;
      // tanks
      for (const t of tanks) {
        if (!t.alive || (t === s.owner && s.age < 0.15)) continue;
        if ((t.x - s.x) ** 2 + (t.y - s.y) ** 2 < 18 * 18) {
          if (t === player && state === 'cleared') { s.alive = false; puff(s.x, s.y); break; }
          s.alive = false; killTank(t); break;
        }
      }
      if (!s.alive) break;
      // mines
      for (const m of mines) {
        if (m.alive && (m.x - s.x) ** 2 + (m.y - s.y) ** 2 < 14 * 14) { s.alive = false; m.fuse = m.t; break; }
      }
    }
    if (!s.alive) continue;
    s.trail -= dt;
    if (s.trail <= 0) {
      s.trail = s.rocket ? 0.012 : 0.03;
      parts.push({ x: s.x - s.vx * 0.02, y: s.y - s.vy * 0.02, vx: rand(-8, 8), vy: rand(-8, 8), life: s.rocket ? 0.5 : 0.35, max: s.rocket ? 0.5 : 0.35, r: s.rocket ? 4 : 2.5, kind: s.rocket ? 'rsmoke' : 'trail' });
    }
  }
  // shell vs shell
  for (let i = 0; i < shells.length; i++) {
    const a = shells[i]; if (!a.alive) continue;
    for (let j = i + 1; j < shells.length; j++) {
      const b = shells[j]; if (!b.alive) continue;
      if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 8 * 8) { a.alive = b.alive = false; puff((a.x + b.x) / 2, (a.y + b.y) / 2); sfx.puff(); break; }
    }
  }
  shells = shells.filter(s => s.alive);
}
function bounceShell(s) {
  s.b--;
  if (s.b < 0) { s.alive = false; puff(s.x, s.y); sfx.puff(); }
  else { sfx.bounce(); for (let i = 0; i < 4; i++) parts.push({ x: s.x, y: s.y, vx: rand(-70, 70), vy: rand(-70, 70), life: 0.18, max: 0.18, r: 1.6, kind: 'spark' }); }
}

function updateMines(dt) {
  for (const m of mines) {
    if (!m.alive) continue;
    m.t += dt;
    if (m.t > 0.6) {
      for (const t of tanks) {
        if (!t.alive || t === m.owner) continue;
        if ((t.x - m.x) ** 2 + (t.y - m.y) ** 2 < 36 * 36) { m.fuse = Math.min(m.fuse, m.t); break; }
      }
    }
    const left = m.fuse - m.t;
    if (left < 2.5) { m.blink = (m.blink || 0) - dt; if (m.blink <= 0) { m.blink = Math.max(0.08, left / 6); if (m.owner === player || Math.random() < 0.5) sfx.beep(); } }
    if (m.t >= m.fuse) { m.alive = false; explode(m.x, m.y, m); }
  }
  mines = mines.filter(m => m.alive);
}

function separateTanks() {
  for (let i = 0; i < tanks.length; i++) {
    const a = tanks[i]; if (!a.alive) continue;
    for (let j = i + 1; j < tanks.length; j++) {
      const b = tanks[j]; if (!b.alive) continue;
      let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy);
      if (d < R * 2 && d > 0.01) {
        const push = (R * 2 - d) / 2; dx /= d; dy /= d;
        const am = a.cfg.speed === 0 ? 0 : 1, bm = b.cfg.speed === 0 ? 0 : 1;
        const aw = a === player ? 1 : am, bw = b === player ? 1 : bm, tot = (aw + bw) || 1;
        a.x -= dx * push * 2 * aw / tot; a.y -= dy * push * 2 * aw / tot;
        b.x += dx * push * 2 * bw / tot; b.y += dy * push * 2 * bw / tot;
      }
    }
  }
}

function update(dt) {
  time += dt; stateT += dt;
  shake = Math.max(0, shake - dt * 30);
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
  parts = parts.filter(p => p.life > 0);
  for (const t of treads) t.life -= dt;
  while (treads.length && treads[0].life <= 0) treads.shift();

  if (state === 'title' || state === 'over' || state === 'win' || state === 'paused' || state === 'world') return;

  if (state === 'intro') { if (stateT > 2.6) setState('play'); return; }

  computeFlow();
  if (player.alive) updatePlayer(dt);
  for (const t of tanks) if (t.alive && t !== player) updateEnemy(t, dt);
  for (const t of tanks) {
    if (!t.alive) continue;
    t.recoil = Math.max(0, t.recoil - dt * 6); t.reveal = Math.max(0, t.reveal - dt);
    moveTank(t, dt);
  }
  separateTanks();
  for (const t of tanks) if (t.alive) moveTank(t, 0); // re-resolve walls after pushes
  updateShells(dt);
  updateMines(dt);

  if (state === 'play') {
    const left = tanks.filter(t => t.alive && t !== player).length;
    if (left === 0 && player.alive) { setState('cleared'); sfx.clear(); }
  }
  if (state === 'cleared' && stateT > 2.2) {
    mission++;
    saveBest(mission + 1 > LEVELS.length ? LEVELS.length : mission + 1);
    if (mission >= LEVELS.length) { mission = LEVELS.length - 1; saveBest(LEVELS.length); unlockWorld(WORLDS.length - 1); setState('win'); updateHud(); return; }
    if (mission % 5 === 0) { lives++; unlockWorld(worldOf(mission) - 1); updateHud(); setState('world'); loadWorldBeat(worldOf(mission)); return; }
    newMission();
  } else if (state === 'dead' && stateT > 2.4) {
    lives--;
    saveBest(mission + 1);
    if (lives <= 0) { lives = 0; updateHud(); setState('over'); }
    else startAttempt();
  }
}

// ---------- Rendering ----------
function drawBg() {
  bg.width = canvas.width; bg.height = canvas.height;
  const b = bg.getContext('2d');
  b.setTransform(scale, 0, 0, scale, 0, 0);
  // floor planks
  b.fillStyle = '#d8b680'; b.fillRect(0, 0, W, H);
  let seed = 1234 + mission * 77;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ph = 32;
  for (let y = 0; y < H; y += ph) {
    let x = -rnd() * 200;
    while (x < W) {
      const len = 140 + rnd() * 160, v = (rnd() - 0.5) * 0.12;
      b.fillStyle = shade('#d8b680', v); b.fillRect(x, y, len, ph);
      b.fillStyle = 'rgba(120,80,40,.10)';
      for (let g = 0; g < 3; g++) b.fillRect(x + 6, y + 6 + rnd() * (ph - 12), len - 12, 1);
      b.fillStyle = 'rgba(90,60,30,.35)'; b.fillRect(x, y, 1.5, ph);
      x += len;
    }
    b.fillStyle = 'rgba(90,60,30,.35)'; b.fillRect(0, y, W, 1.5);
  }
  // pits
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) {
    if (grid[cy * COLS + cx] !== 3) continue;
    const x = cx * TILE, y = cy * TILE;
    const g = b.createRadialGradient(x + 20, y + 22, 2, x + 20, y + 20, 19);
    g.addColorStop(0, '#120c06'); g.addColorStop(0.75, '#2c1d0f'); g.addColorStop(1, '#6b4a26');
    b.fillStyle = g; b.beginPath(); b.arc(x + 20, y + 20, 17, 0, TAU); b.fill();
  }
  // wall shadows
  b.fillStyle = 'rgba(40,25,10,.28)';
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) {
    const t = grid[cy * COLS + cx]; if (t === 1 || t === 2) b.fillRect(cx * TILE + 6, cy * TILE + 7, TILE, TILE);
  }
  // walls
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) {
    const t = grid[cy * COLS + cx]; if (t !== 1 && t !== 2) continue;
    const x = cx * TILE, y = cy * TILE;
    if (t === 1) {
      b.fillStyle = '#a06a35'; b.fillRect(x, y, TILE, TILE);
      b.fillStyle = '#c28a4e'; b.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      b.fillStyle = '#b07a42'; b.fillRect(x + 6, y + 6, TILE - 12, TILE - 12);
      b.fillStyle = 'rgba(255,240,210,.35)'; b.fillRect(x + 2, y + 2, TILE - 4, 2); b.fillRect(x + 2, y + 2, 2, TILE - 4);
      b.fillStyle = 'rgba(60,30,10,.35)'; b.fillRect(x + 2, y + TILE - 4, TILE - 4, 2); b.fillRect(x + TILE - 4, y + 2, 2, TILE - 4);
    } else {
      b.fillStyle = '#c99a5b'; b.fillRect(x, y, TILE, TILE);
      b.fillStyle = '#e8c48a'; b.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      let s2 = cx * 31 + cy * 17 + 7; const r2 = () => (s2 = (s2 * 9301 + 49297) % 233280) / 233280;
      b.fillStyle = 'rgba(140,90,40,.45)';
      for (let i = 0; i < 14; i++) { b.beginPath(); b.arc(x + 5 + r2() * 30, y + 5 + r2() * 30, 1 + r2() * 1.4, 0, TAU); b.fill(); }
      b.strokeStyle = 'rgba(110,70,30,.6)'; b.lineWidth = 1; b.strokeRect(x + 2.5, y + 2.5, TILE - 5, TILE - 5);
    }
  }
  // vignette edge
  const vg = b.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.65);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,20,0,.28)');
  b.fillStyle = vg; b.fillRect(0, 0, W, H);
}

function tankAlpha(t) {
  if (!t.cfg.invisible) return 1;
  if (state === 'intro') return 0.85;
  if (!player.alive || state === 'dead' || state === 'over') return 0.6;
  return Math.min(0.55, t.reveal * 2);
}

function drawTank(t) {
  const c = t.cfg.color, a = tankAlpha(t);
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = a;
  // shadow
  ctx.fillStyle = 'rgba(30,15,0,.25)';
  ctx.beginPath(); ctx.ellipse(t.x + 4, t.y + 6, 19, 16, 0, 0, TAU); ctx.fill();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.bodyAng);
  // treads
  const tc = shade(c, -0.55);
  ctx.fillStyle = tc;
  ctx.fillRect(-17, -16, 34, 8); ctx.fillRect(-17, 8, 34, 8);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  const ph = (t.treadPhase || 0) % 6;
  for (let x = -17 + ph; x < 17; x += 6) { ctx.fillRect(x, -16, 2, 8); ctx.fillRect(x, 8, 2, 8); }
  // hull
  ctx.fillStyle = shade(c, -0.15);
  roundRect(-14, -10, 28, 20, 4); ctx.fill();
  ctx.fillStyle = c;
  roundRect(-12, -8, 24, 16, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-11, -7, 22, 3);
  ctx.restore();
  // turret
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(t.x, t.y);
  ctx.rotate(t.turretAng);
  const rc = t.recoil * 4;
  ctx.fillStyle = shade(c, -0.35);
  ctx.fillRect(2 - rc, -4, 23, 8);
  ctx.fillStyle = shade(c, -0.1);
  ctx.fillRect(2 - rc, -2.5, 22, 5);
  ctx.fillStyle = shade(c, -0.45); ctx.fillRect(22 - rc, -5, 4, 10);
  ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU); ctx.fillStyle = shade(c, -0.25); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, TAU); ctx.fillStyle = shade(c, 0.12); ctx.fill();
  ctx.beginPath(); ctx.arc(-2, -2, 2.5, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1c1915'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const sx = shake ? rand(-shake, shake) * 0.5 : 0, sy = shake ? rand(-shake, shake) * 0.5 : 0;
  ctx.setTransform(scale, 0, 0, scale, sx * scale, sy * scale);
  if (!grid) { ctx.fillStyle = '#d8b680'; ctx.fillRect(0, 0, W, H); return; }
  ctx.drawImage(bg, 0, 0, W, H);

  // scorch marks
  for (const s of scorches) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.fillStyle = 'rgba(40,25,10,.35)';
    if (s.big) { ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(30,18,6,.3)'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill(); }
    else { ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(40,25,10,.4)'; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(14, 14); ctx.moveTo(14, -14); ctx.lineTo(-14, 14); ctx.stroke(); }
    ctx.restore();
  }
  // tread marks
  for (const t of treads) {
    const a = Math.min(1, t.life / 3) * 0.22;
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.a);
    ctx.fillStyle = `rgba(70,45,20,${a})`;
    ctx.fillRect(-2, -15, 4, 6); ctx.fillRect(-2, 9, 4, 6);
    ctx.restore();
  }
  // mines
  for (const m of mines) {
    const left = m.fuse - m.t;
    const lit = left < 2.5 ? (Math.floor(m.t / Math.max(0.08, left / 6)) % 2 === 0) : (Math.floor(m.t * 2) % 2 === 0);
    ctx.fillStyle = 'rgba(30,15,0,.3)'; ctx.beginPath(); ctx.arc(m.x + 2, m.y + 3, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8d24a'; ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#7a6420'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = lit ? (left < 2.5 ? '#ff3b2f' : '#ff8a3d') : '#6d2a10';
    ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, TAU); ctx.fill();
  }
  // tanks
  for (const t of tanks) if (t.alive) drawTank(t);
  // shells
  for (const s of shells) {
    const a = Math.atan2(s.vy, s.vx);
    const own = s.owner; const vis = own && own.cfg.invisible ? 1 : 1;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(a); ctx.globalAlpha = vis;
    ctx.fillStyle = 'rgba(30,15,0,.25)'; ctx.fillRect(-4, 2, 10, 5);
    if (s.rocket) {
      ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(-6, -2.5); ctx.lineTo(-13 - Math.random() * 5, 0); ctx.lineTo(-6, 2.5); ctx.fill();
      ctx.fillStyle = '#f2f2f2'; roundRect(-6, -3.5, 13, 7, 3); ctx.fill();
      ctx.fillStyle = '#d2463c'; ctx.fillRect(3, -3.5, 4, 7);
    } else {
      ctx.fillStyle = '#3a3a3a'; roundRect(-5.5, -3.5, 11, 7, 3.5); ctx.fill();
      ctx.fillStyle = '#f5f1e6'; roundRect(-4.5, -2.5, 9, 5, 2.5); ctx.fill();
    }
    ctx.restore();
  }
  // particles
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.kind === 'fire') { ctx.fillStyle = k > 0.6 ? `rgba(255,240,170,${k})` : `rgba(255,${Math.floor(120 + 100 * k)},40,${k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + k * 0.7), 0, TAU); ctx.fill(); }
    else if (p.kind === 'smoke' || p.kind === 'rsmoke') { ctx.fillStyle = `rgba(${p.kind === 'rsmoke' ? '230,230,230' : '90,85,80'},${k * 0.45})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - k * 0.6), 0, TAU); ctx.fill(); }
    else if (p.kind === 'trail') { ctx.fillStyle = `rgba(255,255,255,${k * 0.4})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
    else if (p.kind === 'spark') { ctx.fillStyle = `rgba(255,230,140,${k})`; ctx.fillRect(p.x - 1, p.y - 1, 2.5, 2.5); }
    else if (p.kind === 'chip') { ctx.fillStyle = `rgba(200,150,90,${k})`; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    else if (p.kind === 'ring') { ctx.strokeStyle = `rgba(255,230,180,${k * 0.8})`; ctx.lineWidth = 4 * k + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.15 - k * 0.8), 0, TAU); ctx.stroke(); }
  }
  // aim line + reticle
  if (player && player.alive && (state === 'play') && mouse.inside) {
    const ax = player.x + Math.cos(player.turretAng) * 26, ay = player.y + Math.sin(player.turretAng) * 26;
    ctx.save();
    ctx.setLineDash([3, 9]); ctx.lineDashOffset = -time * 30;
    ctx.strokeStyle = 'rgba(40,90,170,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#1f5fbf'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y); ctx.moveTo(mouse.x + 6, mouse.y); ctx.lineTo(mouse.x + 15, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y - 6); ctx.moveTo(mouse.x, mouse.y + 6); ctx.lineTo(mouse.x, mouse.y + 15); ctx.stroke();
    ctx.restore();
    // ammo pips near player
    const left = PLAYER_CFG.max - countShells(player);
    for (let i = 0; i < PLAYER_CFG.max; i++) {
      ctx.fillStyle = i < left ? 'rgba(31,95,191,.85)' : 'rgba(31,95,191,.18)';
      ctx.fillRect(player.x - 14 + i * 6, player.y + 22, 4, 4);
    }
  }
  if (state === 'title') { ctx.fillStyle = 'rgba(20,14,8,.35)'; ctx.fillRect(0, 0, W, H); }
}

// ---------- Main loop ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(1 / 30, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  if (state === 'play' || state === 'cleared' || state === 'dead') updateHudCheap();
  render();
  requestAnimationFrame(frame);
}
let hudCache = '';
function updateHudCheap() {
  const n = tanks.filter(t => t.alive && t !== player).length;
  const key = n + '|' + score + '|' + lives + '|' + mission;
  if (key !== hudCache) { hudCache = key; updateHud(); }
}

// title backdrop: show mission 1 layout
fit();
buildGrid(); drawBg();
tanks = [];
LEVELS[0].e.forEach(d => tanks.push(makeTank(d[0], d[1], d[2])));
player = makeTank('player', LEVELS[0].p[0], LEVELS[0].p[1]); tanks.push(player);
updateHud();
hud.store.href = BRAND.store; hud.store.textContent = BRAND.store.replace(/^https?:\/\//, '') + ' ↗';
setMute(muted); setMusic(musicOn); musicReady = true;
setState('title');
requestAnimationFrame(frame);

// expose for testing
window.__rt = { get state() { return state; }, LEVELS, TYPES, step: update, setState, startGame, get tanks() { return tanks; }, get player() { return player; }, get grid() { return grid; }, set mission(v) { mission = v; }, newMission };
})();
</script>
