<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Justron Tanks</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Justron Tanks">
<link rel="apple-touch-icon" href="/tanks/brand/app-icon.png">
<link rel="manifest" href="/tanks/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Cdefs%3E%3ClinearGradient id="fv" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop offset="0" stop-color="#34d399"/%3E%3Cstop offset=".55" stop-color="#bef264"/%3E%3Cstop offset="1" stop-color="#fde047"/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d="M50 4 V22 M50 78 V96 M4 50 H22 M78 50 H96" stroke="url(#fv)" stroke-width="6" stroke-linecap="round"/%3E%3Ccircle cx="50" cy="50" r="31" fill="#111114"/%3E%3Ccircle cx="50" cy="50" r="27" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/%3E%3Ccircle cx="50" cy="50" r="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/%3E%3Ccircle cx="50" cy="50" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/%3E%3Ccircle cx="50" cy="50" r="34" fill="none" stroke="url(#fv)" stroke-width="6"/%3E%3Ccircle cx="50" cy="50" r="14" fill="url(#fv)"/%3E%3Cpath d="M54.5 41 V52.5 A5.2 5.2 0 0 1 44 52.5" fill="none" stroke="#0a0a0a" stroke-width="4.6" stroke-linecap="round"/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
  :root{--bg:#000;--panel:#09090b;--panel2:#18181b;--line:#27272a;--line2:#3f3f46;--txt:#f4f4f5;--muted:#a1a1aa;--dim:#71717a;
        --grad:linear-gradient(90deg,#34d399,#bef264,#fde047);--em:#34d399}
  html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #bgfill{position:fixed;left:-50vw;top:-50vh;width:200vw;height:200vh;background:#000;z-index:-1;pointer-events:none}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  #hud{display:flex;gap:22px;align-items:center;font-weight:600;letter-spacing:.06em;font-size:12px;text-transform:uppercase;height:30px;color:var(--muted)}
  #hud span b{color:var(--txt);font-size:15px;margin-left:6px}
  #hud .hearts{color:#f87171;font-size:16px;letter-spacing:2px}
  #hud button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:4px 11px;font:inherit;font-size:11px;cursor:pointer;transition:.15s}
  #hud button:hover{color:var(--txt);border-color:#71717a}
  #hud button:disabled{opacity:.35;cursor:default}
  #vol{display:inline-flex;align-items:center;gap:6px}
  #vol #muteBtn{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px}
  #vol #muteBtn.off{color:#f87171;border-color:#7f1d1d}
  #volSlider{width:84px;accent-color:#bef264;cursor:pointer}
  #hud a{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;font-size:12px;font-weight:700}
  #stage{position:relative}
  canvas{display:block;border-radius:14px;border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 20px 60px rgba(52,211,153,.07),0 20px 60px rgba(0,0,0,.8);cursor:none;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;pointer-events:none}
  .panel{pointer-events:auto;cursor:default;background:rgba(9,9,11,.94);border:1px solid var(--line);border-radius:20px;padding:30px 38px;text-align:center;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.7);backdrop-filter:blur(6px)}
  .panel h1{margin:0 0 2px;font-size:46px;font-weight:800;letter-spacing:.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .panel h2{margin:0 0 10px;font-size:28px;font-weight:800;letter-spacing:.05em;color:var(--txt)}
  .panel p{margin:8px 0;line-height:1.5;color:#d4d4d8}
  .tag{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .controls{display:grid;grid-template-columns:auto auto;gap:7px 18px;text-align:left;margin:16px auto;width:max-content;font-size:13px;color:var(--muted)}
  .controls kbd{background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:11px;color:var(--txt)}
  .btn{pointer-events:auto;margin-top:14px;background:var(--grad);color:#18181b;border:none;border-radius:999px;padding:11px 30px;font-size:15px;font-weight:800;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;box-shadow:0 8px 24px rgba(16,185,129,.28);transition:transform .15s}
  .btn:hover{transform:scale(1.03)}
  .btn:active{transform:scale(.98)}
  .btn2{pointer-events:auto;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;margin:6px 4px 0;transition:.15s}
  .btn2:hover{border-color:#71717a;background:#27272a}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .banner{background:rgba(9,9,11,.86);border-top:1px solid var(--line);border-bottom:1px solid var(--line);width:100%;padding:18px 0;text-align:center;position:relative}
  .banner:before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--grad)}
  .banner h2{margin:0;font-size:34px;font-weight:800;letter-spacing:.08em;color:var(--txt)}
  .banner p{margin:6px 0 0;color:#d4d4d8}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);padding:4px 11px;border-radius:999px;font-size:13px}
  .chip i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.25)}
  .chip .new{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:11px;font-weight:800;letter-spacing:.05em}
  .stats{margin:12px 0;font-size:15px;color:#d4d4d8}
  .small{font-size:12px;color:var(--dim)}
  .panel a,.banner a,#np a{color:var(--em);text-decoration:none}
  .beat{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
  .beat .err{color:#f87171}
  .card{margin:16px auto 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);font-size:13px;color:var(--muted);max-width:380px}
  .card .bn{font-size:17px;font-weight:800;color:var(--txt);margin:4px 0 8px}
  .lic,.panel a.lic,.card a.lic{display:inline-block;background:var(--grad);color:#18181b;font-weight:800;text-decoration:none;border-radius:999px;padding:9px 18px;font-size:13px;letter-spacing:.03em;box-shadow:0 6px 18px rgba(16,185,129,.25)}
  .code{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:.12em;color:var(--txt);background:#000;border:1px dashed var(--em);border-radius:12px;padding:8px 18px;margin:8px 0}
  .signup{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .signup input{background:#000;border:1px solid var(--line2);border-radius:999px;color:var(--txt);padding:8px 14px;font:inherit;font-size:13px;width:210px;outline:none}
  .signup input:focus{border-color:var(--em)}
  #np{position:absolute;left:10px;bottom:10px;background:rgba(9,9,11,.85);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);display:none;pointer-events:auto;cursor:default;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #np b{color:var(--txt)}
  #toast{position:absolute;top:12px;left:50%;transform:translateX(-50%) translateY(-6px);background:rgba(9,9,11,.92);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--txt);opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .link{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#000;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;margin:10px auto 4px;max-width:420px;word-break:break-all;color:var(--txt);user-select:all;-webkit-user-select:all}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--em);margin-right:8px;animation:pl 1.2s infinite}
  @keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
  /* ---- phone / touch ---- */
  #touch{display:none}
  body.touch.playing #touch{display:block}
  #touch .stick{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(24,24,27,.55);border:1px solid rgba(255,255,255,.14);touch-action:none;z-index:40;-webkit-user-select:none;user-select:none}
  #touch #stickL{left:calc(18px + env(safe-area-inset-left))}
  #touch #stickR{right:calc(18px + env(safe-area-inset-right));border-color:rgba(190,242,100,.35)}
  #touch .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(244,244,245,.85);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
  #touch #stickR .knob{background:#bef264}
  #touch .lbl{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.2em;color:#a1a1aa;pointer-events:none}
  #touch #mineBtn{position:fixed;right:calc(36px + env(safe-area-inset-right));bottom:calc(166px + env(safe-area-inset-bottom));width:88px;height:44px;border-radius:999px;border:1px solid rgba(253,224,71,.5);background:rgba(24,24,27,.75);color:#fde047;font:700 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;touch-action:none;z-index:40}
  #rotate{display:none;position:fixed;inset:0;z-index:60;background:#000;color:var(--txt);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  #rotate svg{width:64px;height:64px}
  @media (orientation: portrait){ body.touch #rotate{display:flex} }
  .touchhelp{display:none}
  body.touch .touchhelp{display:block}
  body.touch span.touchhelp{display:inline}
  body.touch .controls, body.touch .keyhint{display:none}
  body.touch{touch-action:none;position:fixed;inset:0}
  body.touch .panel{touch-action:pan-y}
  body.touch button, body.touch a{touch-action:manipulation}
  body.touch #wrap{gap:0;position:fixed}
  body.touch #hud{gap:10px;font-size:10px;height:24px;position:fixed;z-index:30;top:calc(4px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.62);border:1px solid #27272a;border-radius:999px;padding:0 12px;white-space:nowrap}
  body.touch #hud button{padding:2px 9px;font-size:10px}
  body.touch .panel .notouch{display:none}
  /* phones in landscape: stats in the left rail, now-playing in the right rail, nothing over the arena */
  body.touch.rails #hud{box-sizing:border-box;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);transform:none;width:calc(var(--rail) - 20px);height:auto;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:5px 10px;background:none;border:none;padding:0;white-space:normal;font-size:10px}
  body.touch.rails #hud span b{font-size:13px}
  body.touch.rails #hud .hearts{font-size:12px}
  body.touch.rails #np{position:fixed;box-sizing:border-box;left:auto;bottom:auto;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);width:calc(var(--rail) - 20px);max-width:none;white-space:normal;border-radius:14px;font-size:11px;line-height:1.45;padding:8px 10px;z-index:30}
  @media (max-height:300px){body.touch.rails #np{font-size:10px;line-height:1.35;padding:6px 8px;top:calc(env(safe-area-inset-top) + 6px)}body.touch.rails #touch #mineBtn{bottom:calc(env(safe-area-inset-bottom) + var(--stick) + 30px)}}
body.touch.rails #touch .stick{width:var(--stick);height:var(--stick)}
  body.touch.rails #touch #stickL{left:calc(env(safe-area-inset-left) + max(8px, (var(--rail) - var(--stick)) / 2))}
  body.touch.rails #touch #stickR{right:calc(env(safe-area-inset-right) + max(8px, (var(--rail) - var(--stick)) / 2))}
  body.touch.rails #touch #mineBtn{right:calc(env(safe-area-inset-right) + max(8px, (var(--rail) - 88px) / 2));bottom:calc(env(safe-area-inset-bottom) + var(--stick) + 40px)}
  body.touch .panel{max-width:min(560px,92vw)}
  body.touch #hud span b{font-size:12px}
  body.touch #storeLink, body.touch #volSlider{display:none}
  @media (max-height: 560px){
    .panel{padding:16px 22px;max-height:calc(100% - 12px);overflow:auto;-webkit-overflow-scrolling:touch}
    .panel p{margin:5px 0;font-size:13px}
    .panel h1.logo svg{width:52px;height:52px}
    .logo .wm{font-size:26px}
    .logo .tl{font-size:9px}
    .btn{margin-top:8px;padding:9px 22px;font-size:13px}
    .banner{padding:10px 0}
    .banner h2{font-size:24px}
    .card{margin-top:8px;padding:10px 12px}
    .code{font-size:18px}
  }
  .logo{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 6px}
  .logo svg{flex-shrink:0}
  .logo .wm{white-space:nowrap;font-family:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;font-weight:700;font-size:40px;line-height:1;letter-spacing:.06em;color:var(--txt);text-align:left}
  .logo .wm span{color:#bef264}
  .logo .tl{font-family:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;font-weight:600;font-size:11px;letter-spacing:.5em;color:var(--muted);margin-top:8px;text-align:left}
  #splash .logo .wm{font-size:52px}
  #splash .logo .tl{font-size:13px}
  #splash{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s ease}
  #splash .t{transition:transform .6s ease}
  #splash .s{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
  #splash.out{opacity:0;pointer-events:none}
  #splash.out .t{transform:scale(1.06)}
  @media (prefers-reduced-motion:reduce){#splash,#splash .t{transition:none}}
</style>
</head>
<body>
<div id="splash"><div class="t logo"><svg viewBox="0 0 100 100" width="110" height="110" aria-hidden="true"><defs><linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset=".55" stop-color="#bef264"/><stop offset="1" stop-color="#fde047"/></linearGradient></defs><path d="M50 4 V22 M50 78 V96 M4 50 H22 M78 50 H96" stroke="url(#sp)" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="31" fill="#111114"/><circle cx="50" cy="50" r="27" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><circle cx="50" cy="50" r="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><circle cx="50" cy="50" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/><circle cx="50" cy="50" r="34" fill="none" stroke="url(#sp)" stroke-width="6"/><circle cx="50" cy="50" r="14" fill="url(#sp)"/><path d="M54.5 41 V52.5 A5.2 5.2 0 0 1 44 52.5" fill="none" stroke="#0a0a0a" stroke-width="4.6" stroke-linecap="round"/></svg><div><div class="wm">JUSTRON <span>TANKS</span></div><div class="tl">PLAY TO THE BEAT</div></div></div></div>
<div id="bgfill"></div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="#bef264" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 9a9 9 0 0 1 3-5M21 15a9 9 0 0 1-3 5"/></svg><div style="font-weight:700;font-size:18px">Turn your phone sideways</div><div class="small">Justron Tanks plays in landscape.</div></div>
<div id="touch" aria-hidden="true"><div class="stick" id="stickL"><span class="lbl">DRIVE</span><div class="knob"></div></div><div class="stick" id="stickR"><span class="lbl">AIM · FIRE</span><div class="knob"></div></div><button id="mineBtn" type="button" tabindex="-1">MINE</button></div>
<div id="wrap">
  <div id="hud">
    <span>Mission<b id="hMission">1</b></span>
    <span class="hearts" id="hLives">♥♥♥</span>
    <span>Enemies<b id="hEnemies">0</b></span>
    <span>Score<b id="hScore">0</b></span>
    <a id="storeLink" href="https://justronbeats.com" target="_blank" rel="noopener">justronbeats.com ↗</a>
    <button id="pauseBtn" title="Pause (P / Esc)" disabled>Pause</button>
    <button id="musicBtn" title="Toggle music (N)">Music on</button>
    <span id="vol"><button id="muteBtn" title="Mute (M)" aria-label="Mute"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><input id="volSlider" type="range" min="0" max="100" value="80" aria-label="Volume"></span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay"></div>
    <div id="np"></div>
    <div id="toast"></div>
  </div>
</div>
<input type="file" id="beatFile" accept="audio/*,.mp3,.wav,.ogg,.m4a" style="display:none">
<script>
(() => {
'use strict';
// ================= JUSTRON TANKS CONFIG — edit this block =================
const BRAND = {
  name: 'JUSTRON TANKS',
  tag: 'prod. justron',
  store: 'https://justronbeats.com',
  leasePrice: '$30',
  playerColor: '#34d399',
};
// One beat per world (5 missions each). Put the MP3s in the beats/ folder next to this file.
// link = the beat's page on your store. code = the discount code unlocked by clearing that world (leave '' to hide it).
const WORLDS = [
  { beat: 'Mascara',    prod: 'prod. justron',             file: 'beats/world1.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Really You', prod: 'prod. justron',             file: 'beats/world2.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Drill Time', prod: 'prod. justron x ben baker', file: 'beats/world3.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Drown',      prod: 'prod. justron',             file: 'beats/world4.mp3', link: 'https://justronbeats.com/beats/drown', code: '' },
  { beat: 'Disturbia',  prod: 'prod. justron x thr6x',     file: 'beats/world5.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Mascara', prod: 'prod. justron', file: 'beats/world1.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Really You', prod: 'prod. justron', file: 'beats/world2.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Drill Time', prod: 'prod. justron x ben baker', file: 'beats/world3.mp3', link: 'https://justronbeats.com', code: '' },
  { beat: 'Drown', prod: 'prod. justron', file: 'beats/world4.mp3', link: 'https://justronbeats.com/beats/drown', code: '' },
  { beat: 'Disturbia', prod: 'prod. justron x thr6x', file: 'beats/world5.mp3', link: 'https://justronbeats.com', code: '' },
];
// Optional email capture. On justronbeats.com set endpoint to '/api/subscribe'.
// (Or use Supabase directly: url + anonKey + table.) Leave both empty to hide the signup box.
const SIGNUP = { endpoint: '/api/subscribe', url: '', anonKey: '', table: 'tank_signups' };
// Let players load their own audio file as the soundtrack (off for the public version).
const ALLOW_OWN_BEAT = false;
// Online duos: the store serves Supabase keys at configEndpoint; lib is the Supabase JS file next to this page.
const DUO = { configEndpoint: '/api/tanks-config', lib: 'vendor/supabase.js' };
// On the store, every mission plays a random beat from the catalog. WORLDS beats are the fallback.
const CATALOG = { endpoint: '/api/tanks-beats' };
// ===========================================================================
const TILE = 40, COLS = 24, ROWS = 16, W = COLS * TILE, H = ROWS * TILE;
const TAU = Math.PI * 2, R = 15;
const rad = t => R * ((t.cfg && t.cfg.size) || 1);

// ---------- Levels ----------
// w: [x, y, width, height, type]  type: '#' block, 'x' cork (mines break it), 'o' pit (shells pass over)
// e: [type, x, y]

// Simulate a shell's path. Returns the first tank it would hit, or null.
function traceShot(x, y, ang, bounces, shooter, maxLen = 1500) {
  let vx = Math.cos(ang), vy = Math.sin(ang), d = 0, b = bounces;
  const step = 6;
  while (d < maxLen) {
    const nx = x + vx * step;
    if (shellSolid(nx + Math.sign(vx) * 3, y)) { vx = -vx; if (--b < 0) return null; } else x = nx;
    const ny = y + vy * step;
    if (shellSolid(x, ny + Math.sign(vy) * 3)) { vy = -vy; if (--b < 0) return null; } else y = ny;
    d += step;
    for (const t of tanks) {
      if (!t.alive || (t === shooter && d < 40)) continue;
      if ((t.x - x) ** 2 + (t.y - y) ** 2 < (rad(t) + 3) ** 2) return { tank: t, d };
    }
  }
  return null;
}

  const spread = c.burst ? [-0.16, 0, 0.16] : tri ? [-0.13, 0, 0.13] : [0];
  const bn = c.bounces + (t.isPlayer && pu(t, 'bounce') ? 2 : 0) + (bank ? 1 : 0);
  if (t.isPlayer) missionShots++;
  for (const da of spread) {
    const a2 = ang + da;
    shells.push({ id: nextId++, x: mx, y: my, vx: Math.cos(a2) * c.shell, vy: Math.sin(a2) * c.shell, b: bn, owner: t, age: 0, rocket: !!c.rocket, alive: true, trail: 0, bank });

function hitTank(t, dmg) {

function explode(x, y, src) {
  const RAD = 72;
  for (const m of mines) if (m.alive && m !== src && (m.x - x) ** 2 + (m.y - y) ** 2 < RAD * RAD) m.fuse = Math.min(m.fuse, m.t + 0.08);
  for (const t of tanks) if (t.alive && (t.x - x) ** 2 + (t.y - y) ** 2 < (RAD + 8 + rad(t) - R) ** 2) hitTank(t, 3);
  for (const s of shells) if (s.alive && (s.x - x) ** 2 + (s.y - y) ** 2 < RAD * RAD) { s.alive = false; puff(s.x, s.y); }
  let changed = false;
  const cx0 = Math.floor((x - RAD) / TILE), cx1 = Math.floor((x + RAD) / TILE), cy0 = Math.floor((y - RAD) / TILE), cy1 = Math.floor((y + RAD) / TILE);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    if (tileAt(cx, cy) !== 2) continue;
    const tx = cx * TILE + TILE / 2, ty = cy * TILE + TILE / 2;
    if ((tx - x) ** 2 + (ty - y) ** 2 < (RAD + 12) ** 2) {
      grid[cy * COLS + cx] = 0; changed = true;
      for (let i = 0; i < 8; i++) parts.push({ x: tx + rand(-15, 15), y: ty + rand(-15, 15), vx: rand(-90, 90), vy: rand(-90, 90), life: rand(0.4, 0.8), max: 0.8, r: rand(2, 5), kind: 'chip' });
    }
  }

  fxExplode(x, y);

}

function bindStick(el, onMove, onEnd, onStart) {
  if (!el || !el.addEventListener) return;

  let id = null, cx = 0, cy = 0;
  const R = 46;
  const move = e => {
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy), f = d > R ? R / d : 1;

// ---------- Update ----------
function moveTank(t, dt) {
  if (!t.remote) {
    t.x += t.vx * dt; t.y += t.vy * dt;
    for (const c of currents) if (t.y >= c.y0 * TILE && t.y < c.y1 * TILE) t.x += c.dir * 58 * dt;
  }
  // circle vs tile collision
  const tr = rad(t);
  for (let iter = 0; iter < 2; iter++) {
    const cx0 = Math.floor((t.x - tr) / TILE), cx1 = Math.floor((t.x + tr) / TILE);
    const cy0 = Math.floor((t.y - tr) / TILE), cy1 = Math.floor((t.y + tr) / TILE);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      if (tileAt(cx, cy) === 0) continue;
      const px = Math.max(cx * TILE, Math.min(t.x, cx * TILE + TILE));
      const py = Math.max(cy * TILE, Math.min(t.y, cy * TILE + TILE));
      let dx = t.x - px, dy = t.y - py; const d = Math.hypot(dx, dy);
      if (d < tr) {
        if (d < 0.001) { dx = t.x - (cx * TILE + TILE / 2); dy = t.y - (cy * TILE + TILE / 2); const l = Math.hypot(dx, dy) || 1; t.x += dx / l * tr; t.y += dy / l * tr; }
        else { t.x += dx / d * (tr - d); t.y += dy / d * (tr - d); }
      }
    }
  }
  const sp = Math.hypot(t.vx, t.vy);
  if (sp > 8) {
    const a = Math.atan2(t.vy, t.vx);
    const target = Math.abs(angDiff(t.bodyAng, a)) > Math.PI / 2 ? a + Math.PI : a;
    t.bodyAng = rotToward(t.bodyAng, target, 9 * dt);
    t.trackDist += sp * dt; t.treadPhase += sp * dt;
    if (t.trackDist > 9) { t.trackDist = 0; treads.push({ x: t.x, y: t.y, a: t.bodyAng, life: 8 }); if (treads.length > 900) treads.shift(); }
  }
}

function updatePlayer(t, dt) {
  let ix = 0, iy = 0;
  if (state === 'play') {
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['s'] || keys['arrowdown']) iy += 1;
    if (keys['w'] || keys['arrowup']) iy -= 1;
  }
  if (state === 'play' && touch.move.active) { ix += touch.move.x; iy += touch.move.y; }
  const top = PLAYER_SPEED * (pu(t, 'speed') ? 1.45 : 1) * (speedMul() > 1 ? 1.2 : 1);
  const l = Math.hypot(ix, iy), sp = l > 0.15 ? Math.min(1, l) / l * top : 0;
  const tvx = ix * sp, tvy = iy * sp;
  const k = Math.min(1, dt * (mechanic() === 'ice' ? 2.4 : 14));
  t.vx += (tvx - t.vx) * k; t.vy += (tvy - t.vy) * k;
  if (touch.on) { if (touch.aim.active) t.turretAng = touch.aim.ang; }
  else t.turretAng = Math.atan2(mouse.y - t.y, mouse.x - t.x);
  t.cool -= dt;
}

function think(e) {
  const c = e.cfg;
  e.solution = null;
  e.tgt = nearestPlayer(e);
  if (!e.tgt || state !== 'play') return;
  for (const p of alivePlayers().sort((a, b) => dist2(e, a) - dist2(e, b))) {
    let tx = p.x, ty = p.y;
    if (c.lead || smartTier() >= 3) { const tt = Math.sqrt(dist2(e, p)) / c.shell; tx += p.vx * tt * 0.9; ty += p.vy * tt * 0.9; }
    const a0 = Math.atan2(ty - e.y, tx - e.x);
    const h = traceShot(e.x, e.y, a0, c.bounces, e);
    if (h && h.tank.isPlayer) { e.solution = a0; break; }
  }
  if (e.solution == null && c.aim === 'bounce') {
    let bestA = null, bd = 99;
    const N = 80, off = Math.random() * TAU / N;
    for (let i = 0; i < N; i++) {
      const a = off + i / N * TAU;
      const hh = traceShot(e.x, e.y, a, c.bounces, e);
      if (hh && hh.tank.isPlayer) { const d = Math.abs(angDiff(e.turretAng, a)); if (d < bd) { bd = d; bestA = a; } }
    }
    e.solution = bestA;
  }
  // mine laying
  if (c.mines && e.mineCd <= 0 && countMines(e) < c.mines && Math.random() < (e.type === 'y' ? 0.35 : 0.15)) {
    let near = false;
    for (const m of mines) if (m.alive && (m.x - e.x) ** 2 + (m.y - e.y) ** 2 < 110 * 110) near = true;
    if (!near && dist2(e, e.tgt) < 420 * 420 && dist2(e, e.tgt) > 70 * 70) { if (layMine(e)) e.mineCd = rand(3, 6); }
  }
}

function updateEnemy(e, dt) {
  const c = e.cfg;
  e.cool -= dt; e.thinkT -= dt; e.mineCd -= dt;
  if (e.thinkT <= 0) { e.thinkT = rand(0.2, 0.32); think(e); }
  const tp = (e.tgt && e.tgt.alive) ? e.tgt : (nearestPlayer(e) || player);
  const want = e.solution != null ? e.solution : Math.atan2(tp.y - e.y, tp.x - e.x) + Math.sin(time * 0.8 + e.seed) * 0.9;
  e.turretAng = rotToward(e.turretAng, want, c.turn * dt);
  if (e.solution != null && state === 'play' && tp.alive && e.cool <= 0 && countShells(e) < c.max && Math.abs(angDiff(e.turretAng, e.solution)) < 0.06) {
    const h = traceShot(e.x, e.y, e.turretAng, c.bounces, e);
    if (h && h.tank.isPlayer) fire(e, e.turretAng + rand(-c.err, c.err));
    else { e.cool = 0.15; e.solution = null; }
  }
  // movement
  let dx = 0, dy = 0;
  if (c.speed > 0 && state !== 'intro') {
    const dP = Math.sqrt(dist2(e, tp));
    if (tp.alive) {
      if (dP > c.keep) { const v = flowDir(e, false); if (v) { dx += v[0]; dy += v[1]; } }
      else if (dP < c.keep * 0.55) { const v = flowDir(e, true); if (v) { dx += v[0]; dy += v[1]; } }
    }
    e.wT -= dt;
    if (e.wT <= 0) { e.wT = rand(1, 2.6); e.wA = Math.random() * TAU; }
    if (tankSolidPt(e.x + Math.cos(e.wA) * 30, e.y + Math.sin(e.wA) * 30)) e.wA += Math.PI * rand(0.5, 1.5);
    dx += Math.cos(e.wA) * 0.6; dy += Math.sin(e.wA) * 0.6;
    // dodge incoming shells
    for (const s of shells) {
      if (!s.alive || (s.owner === e && s.age < 0.4)) continue;
      const rx = e.x - s.x, ry = e.y - s.y, vv = s.vx * s.vx + s.vy * s.vy;
      const tt = (rx * s.vx + ry * s.vy) / vv;
      if (tt < 0 || tt > 0.9) continue;
      const cx = rx - s.vx * tt, cy = ry - s.vy * tt, cd = Math.hypot(cx, cy);
      if (cd < 36) {
        let nx, ny;
        if (cd < 0.01) { const l = Math.sqrt(vv); nx = -s.vy / l; ny = s.vx / l; } else { nx = cx / cd; ny = cy / cd; }
        const w = c.dodge * 4 * (1.3 - cd / 36) * (1 + smartTier() * 0.25);
        dx += nx * w; dy += ny * w;
      }
    }
    // smarter enemies in later worlds: circle around you, and rush in while you're out of shells
    const tier = smartTier();
    if (tier && tp.alive) {
      if (dP < c.keep * 1.8) { const fa = Math.atan2(tp.y - e.y, tp.x - e.x) + (e.seed > 5 ? 1 : -1) * Math.PI / 2; dx += Math.cos(fa) * 0.35 * Math.min(2, tier); dy += Math.sin(fa) * 0.35 * Math.min(2, tier); }
      if (tp.isPlayer && countShells(tp) >= maxShells(tp) - 1 && dP > 80) { const v = flowDir(e, false); if (v) { dx += v[0] * 1.4; dy += v[1] * 1.4; } }
    }
    // avoid mines
    for (const m of mines) {
      if (!m.alive) continue;
      const mx = e.x - m.x, my = e.y - m.y, md = Math.hypot(mx, my);
      if (md < 105 && md > 0.1) { const w = 5 * (1 - md / 105); dx += mx / md * w; dy += my / md * w; }
    }
  }
  const l = Math.hypot(dx, dy);
  const esp = c.speed * speedMul() * (1 + smartTier() * 0.04);
  const tvx = l > 0.15 ? dx / l * esp : 0, tvy = l > 0.15 ? dy / l * esp : 0;
  const k = Math.min(1, dt * (mechanic() === 'ice' ? 2 : 6));
  e.vx += (tvx - e.vx) * k; e.vy += (tvy - e.vy) * k;
}

function updateShells(dt) {
  for (const s of shells) {
    if (!s.alive) continue;
    s.age += dt;
    const sp = Math.hypot(s.vx, s.vy);
    const steps = Math.max(1, Math.ceil(sp * dt / 4));
    const sdt = dt / steps;
    for (let i = 0; i < steps && s.alive; i++) {
      const nx = s.x + s.vx * sdt;
      if (shellSolid(nx + Math.sign(s.vx) * 3, s.y)) { s.vx = -s.vx; bounceShell(s); } else s.x = nx;
      if (!s.alive) break;
      const ny = s.y + s.vy * sdt;
      if (shellSolid(s.x, ny + Math.sign(s.vy) * 3)) { s.vy = -s.vy; bounceShell(s); } else s.y = ny;
      if (!s.alive) break;
      // tanks
      for (const t of tanks) {
        if (!t.alive || (t === s.owner && s.age < 0.15)) continue;
        if ((t.x - s.x) ** 2 + (t.y - s.y) ** 2 < (rad(t) + 3) ** 2) {
          if (t.isPlayer && state === 'cleared') { s.alive = false; puff(s.x, s.y); break; }
          if (s.bank && !s.bounced && !t.isPlayer) { s.alive = false; puff(s.x, s.y, true); break; }
          s.alive = false; hitTank(t, 1); break;
        }
      }
      if (!s.alive) break;
      // mines
      for (const m of mines) {
        if (m.alive && (m.x - s.x) ** 2 + (m.y - s.y) ** 2 < 14 * 14) { s.alive = false; m.fuse = m.t; break; }
      }
    }
    if (!s.alive) continue;
    s.trail -= dt;
    if (s.trail <= 0) {
      s.trail = s.rocket ? 0.012 : 0.03;
      parts.push({ x: s.x - s.vx * 0.02, y: s.y - s.vy * 0.02, vx: rand(-8, 8), vy: rand(-8, 8), life: s.rocket ? 0.5 : 0.35, max: s.rocket ? 0.5 : 0.35, r: s.rocket ? 4 : 2.5, kind: s.rocket ? 'rsmoke' : 'trail' });
    }
  }
  // shell vs shell
  for (let i = 0; i < shells.length; i++) {
    const a = shells[i]; if (!a.alive) continue;
    for (let j = i + 1; j < shells.length; j++) {
      const b = shells[j]; if (!b.alive) continue;
      if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 8 * 8) { a.alive = b.alive = false; puff((a.x + b.x) / 2, (a.y + b.y) / 2, true); break; }
    }
  }
  shells = shells.filter(s => s.alive);
}
function bounceShell(s) {
  s.b--; s.bounced = true;
  if (s.b < 0) { s.alive = false; puff(s.x, s.y, true); }
  else { fxBounce(s.x, s.y); emit({ e: 'b', x: Math.round(s.x), y: Math.round(s.y) }); }
}

function updateMines(dt) {
  for (const m of mines) {
    if (!m.alive) continue;
    m.t += dt;
    if (m.t > 0.6) {
      for (const t of tanks) {
        if (!t.alive || t === m.owner) continue;
        if ((t.x - m.x) ** 2 + (t.y - m.y) ** 2 < 36 * 36) { m.fuse = Math.min(m.fuse, m.t); break; }
      }
    }
    const left = m.fuse - m.t;
    if (left < 2.5) { m.blink = (m.blink || 0) - dt; if (m.blink <= 0) { m.blink = Math.max(0.08, left / 6); if (m.owner === me || Math.random() < 0.5) sfx.beep(); } }
    if (m.t >= m.fuse) { m.alive = false; explode(m.x, m.y, m); }
  }
  mines = mines.filter(m => m.alive);
}

function separateTanks() {
  for (let i = 0; i < tanks.length; i++) {
    const a = tanks[i]; if (!a.alive) continue;
    for (let j = i + 1; j < tanks.length; j++) {
      const b = tanks[j]; if (!b.alive) continue;
      let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy);
      const rr = rad(a) + rad(b);
      if (d < rr && d > 0.01) {
        const push = (rr - d) / 2; dx /= d; dy /= d;
        const am = a.cfg.speed === 0 ? 0 : 1, bm = b.cfg.speed === 0 ? 0 : 1;
        const aw = a.isPlayer ? 1 : am, bw = b.isPlayer ? 1 : bm, tot = (aw + bw) || 1;
        a.x -= dx * push * 2 * aw / tot; a.y -= dy * push * 2 * aw / tot;
        b.x += dx * push * 2 * bw / tot; b.y += dy * push * 2 * bw / tot;
      }
    }
  }
}

function update(dt) {
  time += dt; stateT += dt;
  shake = Math.max(0, shake - dt * 30);
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
  parts = parts.filter(p => p.life > 0);
  for (const t of treads) t.life -= dt;
  while (treads.length && treads[0].life <= 0) treads.shift();
  net.tick(dt);
  if (net.role === 'guest') { updateGuest(dt); return; }

  if (['title', 'over', 'win', 'paused', 'world', 'lobby', 'join', 'joining', 'lost', 'board', 'chdone', 'chboard'].includes(state)) return;

  if (state === 'intro') { if (stateT > 2.6) setState('play'); return; }

  computeFlow();
  if (player.alive) updatePlayer(player, dt);
  if (player2) player2.cool -= dt;
  for (const t of tanks) if (t.alive && !t.isPlayer) updateEnemy(t, dt);
  for (const t of tanks) {
    if (!t.alive) continue;
    t.recoil = Math.max(0, t.recoil - dt * 6); t.reveal = Math.max(0, t.reveal - dt); t.hurt = Math.max(0, (t.hurt || 0) - dt);
    moveTank(t, dt);
  }
  separateTanks();
  for (const t of tanks) if (t.alive) moveTank(t, 0); // re-resolve walls after pushes
  updateShells(dt);
  updateMines(dt);
  updateMechanics(dt);
  if (state === 'play') missionTime += dt;

  if (state === 'play') {
    const left = tanks.filter(t => t.alive && !t.isPlayer).length;
    if (left === 0 && alivePlayers().length) { if (!challenge) rateMission(); setState('cleared'); sfx.clear(); emit({ e: 'clr' }); track('tanks_mission_cleared', { score }); }
  }
  if (challenge) {
    if (state === 'cleared' && stateT > 1.6) finishChallenge(true);
    else if (state === 'dead' && stateT > 1.8) finishChallenge(false);
    return;
  }
  if (state === 'cleared' && stateT > 3.2) {
    mission++;
    saveBest(mission + 1 > LEVELS.length ? LEVELS.length : mission + 1);
    if (mission >= LEVELS.length) { mission = LEVELS.length - 1; saveBest(LEVELS.length); unlockWorld(WORLDS.length - 1); setState('win'); track('tanks_win', { score, kills }); updateHud(); return; }
    if (mission % 5 === 0) { lives++; unlockWorld(worldOf(mission) - 1); updateHud(); setState('world'); loadBeat(upcomingBeat()); return; }
    newMission();
  } else if (state === 'dead' && stateT > 2.4) {
    lives--;
    saveBest(mission + 1);
    if (lives <= 0) { lives = 0; updateHud(); setState('over'); track('tanks_game_over', { score, kills }); }
    else startAttempt();
  }
}

function grant(t, k) {

function updateMechanics(dt) {

  // power-ups
  puTimer -= dt;
  if (puTimer <= 0 && pickups.length < (net.connected ? 2 : 1)) { spawnPickup(); puTimer = rand(11, 17); }
  for (const p of pickups) {
    p.t += dt;
    for (const t of alivePlayers()) if ((t.x - p.x) ** 2 + (t.y - p.y) ** 2 < 30 * 30) { grant(t, p.kind); p.dead = true; break; }
    if (p.t > 14) p.dead = true;

  for (const t of tanks) if (t.isPlayer && t.pu) for (const k in t.pu) t.pu[k] = Math.max(0, t.pu[k] - dt);
  // lava eruptions
  if (mechanic() === 'lava') {

      const pits = [];
      for (let i = 0; i < grid.length; i++) if (grid[i] === 3) pits.push(i);
      if (pits.length) {

  hazards = hazards.filter(h => h.t < h.life + 0.05);
  // flickering neon walls
  if (flick) {
    flick.t += dt;
    const per = flick.on ? 4.5 : 3;
    flick.warn = flick.t > per - 0.9;
    if (flick.t >= per) {
      if (flick.on) { for (const i of flick.tiles) if (grid[i] === 1) grid[i] = 0; }
      else for (const i of flick.tiles) {
        const cx = i % COLS, cy = Math.floor(i / COLS), x = cx * TILE + TILE / 2, y = cy * TILE + TILE / 2;
        if (grid[i] !== 0) continue;
        if (tanks.some(t => t.alive && Math.abs(t.x - x) < TILE / 2 + rad(t) && Math.abs(t.y - y) < TILE / 2 + rad(t))) continue;
        grid[i] = 1;

    }
  }
}

  const info = TWISTS[((weekNo % TWISTS.length) + TWISTS.length) % TWISTS.length];
  const theme = r.int(0, THEMES.length - 1), pool = ['g', 'y', 'r', 'p', 'w', 'e', 't', 'k'];

const dark = document.createElement('canvas');
function drawDark() {
  if (dark.width !== canvas.width || dark.height !== canvas.height) { dark.width = canvas.width; dark.height = canvas.height; }
  const d = dark.getContext('2d');
  d.setTransform(1, 0, 0, 1, 0, 0); d.globalCompositeOperation = 'source-over';
  d.clearRect(0, 0, dark.width, dark.height);
  d.fillStyle = 'rgba(2,2,5,.955)'; d.fillRect(0, 0, dark.width, dark.height);
  d.setTransform(scale, 0, 0, scale, 0, 0); d.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a = 1) => { const g = d.createRadialGradient(x, y, r * 0.2, x, y, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = g; d.beginPath(); d.arc(x, y, r, 0, TAU); d.fill(); };
  for (const t of tanks) if (t.alive && t.isPlayer) { hole(t.x, t.y, 160); hole(t.x + Math.cos(t.turretAng) * 130, t.y + Math.sin(t.turretAng) * 130, 85, 0.75); }
  for (const t of tanks) if (t.alive && !t.isPlayer && t.reveal > 0) hole(t.x, t.y, 70, Math.min(1, t.reveal * 3));
  for (const s of shells) hole(s.x, s.y, 46, 0.85);
  for (const p of parts) if (p.kind === 'fire' || p.kind === 'ring') hole(p.x, p.y, p.kind === 'ring' ? p.r * 1.6 : 30, 0.7 * (p.life / p.max));
  for (const p of pickups) hole(p.x, p.y, 34, 0.8);
  for (const h of hazards) hole(h.x, h.y, 70, 0.8);
  for (const m of mines) hole(m.x, m.y, 22, 0.5);
  if (mechanic() === 'lava') for (let i = 0; i < grid.length; i++) if (grid[i] === 3) hole((i % COLS) * TILE + 20, Math.floor(i / COLS) * TILE + 20, 44, 0.6);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.restore();
}
function drawExtras() {
  // flickering walls
  if (flick) for (const i of flick.tiles) {

    const s = oldShells.get(id) || { id, trail: 0, alive: true };

}
function updateGuest(dt) {
  if (me) {
    if (me.alive && state === 'play') updatePlayer(me, dt); else { me.vx = 0; me.vy = 0; me.cool -= dt; }
    if (me.alive) { me.recoil = Math.max(0, me.recoil - dt * 6); moveTank(me, dt); }
  }
  const k = Math.min(1, dt * 14);
  for (const t of tanks) {
    if (t === me || !t.alive || t.tx == null) continue;
    const dx = t.tx - t.x, dy = t.ty - t.y;
    if (dx * dx + dy * dy > 120 * 120) { t.x = t.tx; t.y = t.ty; }
    else { t.x += dx * k; t.y += dy * k; }
    t.bodyAng += angDiff(t.bodyAng, t.tb) * k;
    t.turretAng += angDiff(t.turretAng, t.tta) * k;
    const mv = Math.hypot(dx, dy) * k;
    t.trackDist += mv; t.treadPhase += mv;
    if (t.trackDist > 9) { t.trackDist = 0; treads.push({ x: t.x, y: t.y, a: t.bodyAng, life: 8 }); if (treads.length > 900) treads.shift(); }
    t.reveal = Math.max(0, t.reveal - dt); t.hurt = Math.max(0, (t.hurt || 0) - dt);
  }
  for (const s of shells) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.trail -= dt;
    if (s.trail <= 0) {
      s.trail = s.rocket ? 0.012 : 0.03;
      parts.push({ x: s.x - s.vx * 0.02, y: s.y - s.vy * 0.02, vx: rand(-8, 8), vy: rand(-8, 8), life: s.rocket ? 0.5 : 0.35, max: s.rocket ? 0.5 : 0.35, r: s.rocket ? 4 : 2.5, kind: s.rocket ? 'rsmoke' : 'trail' });
    }
  }
  for (const q of mines) q.t += dt;
  for (const h of hazards) h.t += dt;
  hazards = hazards.filter(h => h.t < h.life + 0.05);
}
